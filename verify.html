<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification | RD CyberForge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .brand {
            font-size: 26px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            margin: 15px 0;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e293b;
        }

        #result {
            margin-top: 25px;
        }

        .success {
            color: #16a34a;
            font-size: 21px;
            font-weight: bold;
        }

        .not-found {
            color: #dc2626;
            font-size: 21px;
            font-weight: bold;
        }

        .certificate-name {
            color: #111827;
            margin-top: 10px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 22px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .download-btn:hover {
            background: #15803d;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">
            RD CyberForge
        </div>

        <div class="subtitle">
            Certificate Verification Portal
        </div>

        <h1>Find Your Certificate</h1>

        <p>
            Enter your registered name below.
        </p>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="off"
        >

        <button onclick="verifyCertificate()">
            Verify Certificate
        </button>

        <div id="result"></div>

        <div class="footer">
            © 2026 RD CyberForge
        </div>

    </div>


    <script>

        /*
        ==========================================
        CERTIFICATE DATABASE
        ==========================================

        Add your members here.

        IMPORTANT:
        The PDF filename must EXACTLY match
        the file uploaded to your GitHub repository.
        */

        const certificates = {

            "Sachin kumar": "Sachin-Kumar.pdf",

            "Hemalatha": "Hemalatha.pdf"

        };


        function verifyCertificate() {

            const inputName = document
                .getElementById("name")
                .value
                .trim()
                .toLowerCase();

            const result = document
                .getElementById("result");


            // Empty name check

            if (inputName === "") {

                result.innerHTML = `
                    <div class="not-found">
                        Please enter your name.
                    </div>
                `;

                return;
            }


            // Search certificate

            if (certificates[inputName]) {

                const certificateFile =
                    certificates[inputName];

                result.innerHTML = `

                    <div class="success">
                        ✓ Certificate Found
                    </div>

                    <div class="certificate-name">
                        Certificate issued to
                        <strong>
                            ${inputName
                                .split(" ")
                                .map(word =>
                                    word.charAt(0).toUpperCase()
                                    + word.slice(1)
                                )
                                .join(" ")
                            }
                        </strong>
                    </div>

                    <a
                        class="download-btn"
                        href="${certificateFile}"
                        target="_blank"
                        download
                    >
                        View / Download Certificate
                    </a>

                `;

            } else {

                result.innerHTML = `

                    <div class="not-found">
                        ✕ Certificate Not Found
                    </div>

                    <p>
                        Please check your name and try again.
                    </p>

                `;
            }
        }


        // Allow pressing ENTER

        document
            .getElementById("name")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    verifyCertificate();

                }

            });

    </script>

</body>

</html>
