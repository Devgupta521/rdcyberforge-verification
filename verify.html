</head>


<body>


<div class="container">


    <div class="brand">
        RD CYBERFORGE
    </div>


    <div class="tagline">
        Cybersecurity Training & Learning
    </div>


    <div class="card" id="result">

        <div class="loading">
            Verifying certificate...
        </div>

    </div>


    <div class="footer">

        © 2026 RD CyberForge<br>

        Official Certificate Verification Portal

    </div>


</div>


<script>

/*
====================================================
GET PARTICIPANT NAME FROM URL
====================================================
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const enteredName =
    urlParams.get("name");


const result =
    document.getElementById("result");


/*
====================================================
CHECK NAME
====================================================
*/

if (!enteredName) {

    result.innerHTML = `

        <div class="error">

            ❌ No participant name provided.

        </div>

        <a
            class="back"
            href="index.html">

            ← Back to Verification

        </a>

    `;

} else {

    loadCertificate();

}


/*
====================================================
LOAD CERTIFICATE
====================================================
*/

async function loadCertificate() {

    try {

        const response =
            await fetch("certificates.json");


        if (!response.ok) {

            throw new Error(
                "Unable to load certificates.json"
            );

        }


        const certificates =
            await response.json();


        /*
        ==============================================
        NORMALIZE ENTERED NAME
        ==============================================
        */

        const searchName =
            enteredName
                .trim()
                .toLowerCase();


        /*
        ==============================================
        FIND PARTICIPANT
        ==============================================
        */

        let participant = null;


        for (
            const key in certificates
        ) {

            const data =
                certificates[key];


            if (
                data.name
                    .trim()
                    .toLowerCase()
                === searchName
            ) {

                participant = data;

                break;

            }

        }


        /*
        ==============================================
        CERTIFICATE NOT FOUND
        ==============================================
        */

        if (!participant) {

            result.innerHTML = `

                <div class="error">

                    ❌ Certificate Not Found

                </div>

                <p>

                    No certificate was found
                    for:

                </p>

                <strong>
                    ${escapeHTML(enteredName)}
                </strong>

                <br><br>

                <a
                    class="back"
                    href="index.html">

                    ← Back to Verification

                </a>

            `;

            return;

        }


        /*
        ==============================================
        CERTIFICATE FOUND
        ==============================================
        */

        result.innerHTML = `

            <div class="status">

                ✓ Certificate Verified

            </div>


            <div class="name">

                ${escapeHTML(participant.name)}

            </div>


            <img
                class="certificate"
                src="${encodeURI(participant.certificate)}"
                alt="Certificate of ${escapeHTML(participant.name)}"
                onerror="certificateError()"
            >


            <a
                class="download"
                href="${encodeURI(participant.certificate)}"
                download>

                DOWNLOAD CERTIFICATE

            </a>


            <br>


            <a
                class="back"
                href="index.html">

                ← Verify Another Name

            </a>

        `;

    }

    catch (error) {

        console.error(error);


        result.innerHTML = `

            <div class="error">

                ❌ Unable to verify certificate.

            </div>


            <p>

                Please make sure
                <strong>certificates.json</strong>
                is uploaded correctly.

            </p>


            <a
                class="back"
                href="index.html">

                ← Back to Verification

            </a>

        `;

    }

}


/*
====================================================
CERTIFICATE IMAGE ERROR
====================================================
*/

function certificateError() {

    result.innerHTML = `

        <div class="error">

            ✓ Participant Found

            <br><br>

            But the certificate file
            could not be loaded.

        </div>


        <p>

            Please check the certificate
            filename in certificates.json.

        </p>


        <a
            class="back"
            href="index.html">

            ← Back to Verification

        </a>

    `;

}


/*
====================================================
SECURITY: ESCAPE HTML
====================================================
*/

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>


</body>

</html>
