<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification | RD CyberForge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px 25px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #111827;

            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        h1 {
            color: #111827;
            font-size: 24px;
        }

        p {
            color: #475569;
        }

        input {
            width: 100%;

            padding: 14px;

            margin: 15px 0;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1e293b;
        }

        #result {
            margin-top: 25px;
        }

        .success {
            color: #16a34a;
            font-size: 22px;
            font-weight: bold;
        }

        .not-found {
            color: #dc2626;
            font-size: 22px;
            font-weight: bold;
        }

        .certificate-name {
            margin-top: 12px;
            color: #111827;
        }

        .download {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 22px;

            background: #16a34a;

            color: white;

            text-decoration: none;

            border-radius: 9px;

            font-weight: bold;
        }

        .download:hover {
            background: #15803d;
        }

        .footer {
            margin-top: 30px;

            font-size: 13px;

            color: #94a3b8;
        }
    </style>

</head>


<body>

<div class="container">

    <div class="brand">
        RD CyberForge
    </div>

    <div class="subtitle">
        Certificate Verification Portal
    </div>

    <h1>
        Find Your Certificate
    </h1>

    <p>
        Enter your registered name below.
    </p>


    <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        autocomplete="off"
    >


    <button onclick="verifyCertificate()">
        Verify Certificate
    </button>


    <div id="result"></div>


    <div class="footer">
        © 2026 RD CyberForge
    </div>

</div>


<script>


function verifyCertificate() {

    const inputName = document
        .getElementById("name")
        .value
        .trim()
        .toLowerCase();


    const result = document
        .getElementById("result");


    // Check empty input

    if (inputName === "") {

        result.innerHTML = `

            <div class="not-found">
                Please enter your name.
            </div>

        `;

        return;
    }


    // Read certificates.json

    fetch("certificates.json")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to load certificates.json"
                );

            }

            return response.json();

        })


        .then(data => {

            const certificate = data[inputName];


            // Certificate found

            if (certificate) {

                result.innerHTML = `

                    <div class="success">
                        ✓ Certificate Found
                    </div>


                    <div class="certificate-name">

                        Certificate issued to:

                        <br>

                        <strong>
                            ${certificate.name}
                        </strong>

                    </div>


                    <a
                        class="download"
                        href="${certificate.certificate}"
                        target="_blank"
                        download
                    >
                        View / Download Certificate
                    </a>

                `;

            }


            // Certificate not found

            else {

                result.innerHTML = `

                    <div class="not-found">
                        ✕ Certificate Not Found
                    </div>

                    <p>
                        No certificate was found
                        for this name.
                    </p>

                `;

            }

        })


        .catch(error => {

            console.error(error);

            result.innerHTML = `

                <div class="not-found">
                    Unable to Verify
                </div>

                <p>
                    Please try again later.
                </p>

            `;

        });

}



// Allow ENTER key

document
    .getElementById("name")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

            verifyCertificate();

        }

    });


</script>

</body>

</html>
