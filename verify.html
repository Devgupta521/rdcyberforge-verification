<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification | RD CyberForge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .tagline {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .verified {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 30px;
            background: #e8f7ee;
            color: #16803c;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .details {
            text-align: left;
            border-top: 1px solid #eee;
            margin-top: 5px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #777;
            font-size: 14px;
        }

        .value {
            font-weight: 600;
            text-align: right;
            font-size: 14px;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #888;
        }

        .invalid {
            color: #c62828;
            background: #fdecec;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        @media (max-width: 450px) {
            .card {
                padding: 25px 20px;
            }

            .row {
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">RD CYBERFORGE</div>

    <div class="tagline">
        Cybersecurity Training & Learning
    </div>

    <h1>Certificate Verification</h1>

    <div id="result">
        Verifying certificate...
    </div>

    <div class="footer">
        This page confirms the authenticity of an RD CyberForge certificate.
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const certificateId = params.get("id");

fetch("certificates.json")
    .then(response => response.json())
    .then(certificates => {

        const result = document.getElementById("result");

        if (certificateId && certificates[certificateId]) {

            const cert = certificates[certificateId];

            result.innerHTML = `
                <div class="verified">
                    ✓ Certificate Verified
                </div>

                <div class="details">

                    <div class="row">
                        <div class="label">Certificate ID</div>
                        <div class="value">${certificateId}</div>
                    </div>

                    <div class="row">
                        <div class="label">Name</div>
                        <div class="value">${cert.name}</div>
                    </div>

                    <div class="row">
                        <div class="label">Course</div>
                        <div class="value">${cert.course}</div>
                    </div>

                    <div class="row">
                        <div class="label">Duration</div>
                        <div class="value">${cert.duration}</div>
                    </div>

                    <div class="row">
                        <div class="label">Issue Date</div>
                        <div class="value">${cert.issueDate}</div>
                    </div>

                    <div class="row">
                        <div class="label">Status</div>
                        <div class="value">${cert.status}</div>
                    </div>

                </div>
            `;

        } else {

            result.innerHTML = `
                <div class="invalid">
                    ✕ Certificate Not Found
                </div>

                <p>
                    The certificate ID provided could not be verified.
                </p>
            `;
        }

    })
    .catch(error => {

        document.getElementById("result").innerHTML = `
            <div class="invalid">
                Verification Error
            </div>

            <p>
                Please try again later.
            </p>
        `;

    });

</script>

</body>
</html>
