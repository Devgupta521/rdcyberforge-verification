```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification | RD CyberForge</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            color: #111;
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
        }

        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }

        .download {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>RD CYBERFORGE</h1>

    <p>Certificate Verification</p>

    <div class="card" id="result">

        Checking certificate...

    </div>

</div>


<script>

async function verify() {

    const result =
        document.getElementById("result");


    /*
    GET NAME FROM URL
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const enteredName =
        params.get("name");


    if (!enteredName) {

        result.innerHTML = `
            <p class="error">
                No participant name provided.
            </p>
        `;

        return;

    }


    /*
    LOAD JSON
    */

    try {

        const response =
            await fetch(
                "./certificates.json"
            );


        if (!response.ok) {

            throw new Error(
                "certificates.json could not be loaded"
            );

        }


        const certificates =
            await response.json();


        /*
        NORMALIZE NAME
        */

        const searchName =
            enteredName
                .trim()
                .toLowerCase();


        /*
        SEARCH JSON
        */

        let participant = null;


        for (
            const key in certificates
        ) {

            const item =
                certificates[key];


            if (
                item.name
                    .trim()
                    .toLowerCase()
                === searchName
            ) {

                participant = item;

                break;

            }

        }


        /*
        NOT FOUND
        */

        if (!participant) {

            result.innerHTML = `

                <h2>
                    ❌ Certificate Not Found
                </h2>

                <p>
                    No certificate is registered
                    for:
                </p>

                <strong>
                    ${enteredName}
                </strong>

            `;

            return;

        }


        /*
        FOUND
        */

        result.innerHTML = `

            <h2>
                ✓ Certificate Verified
            </h2>

            <h3>
                ${participant.name}
            </h3>

            <img
                src="./${participant.certificate}"
                alt="Certificate"
                onerror="imageError()"
            >

            <br>

            <a
                class="download"
                href="./${participant.certificate}"
                download>

                DOWNLOAD CERTIFICATE

            </a>

        `;

    }


    catch (error) {

        console.error(error);


        result.innerHTML = `

            <h2 class="error">
                ❌ Verification Error
            </h2>

            <p>
                ${error.message}
            </p>

            <p>
                Check that
                <strong>certificates.json</strong>
                exists in the same folder as
                verify.html.
            </p>

        `;

    }

}


function imageError() {

    document.getElementById("result").innerHTML = `

        <h2>
            ✓ Participant Found
        </h2>

        <p class="error">
            Certificate image could not be loaded.
        </p>

        <p>
            Check the filename in
            certificates.json.
        </p>

    `;

}


verify();

</script>

</body>

</html>
```
