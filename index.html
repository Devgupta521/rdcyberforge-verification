
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Official RD CyberForge Certificate Verification Portal">
<title>Certificate Verification | RD CyberForge</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#080808,#151515,#242424);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: white;
}

.page { width: 100%; max-width: 560px; text-align: center; }

.brand {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.tagline {
    font-size: 14px;
    color: #b5b5b5;
    margin-bottom: 30px;
}

.card {
    background: white;
    color: #111;
    border-radius: 22px;
    padding: 35px 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

h1 { margin: 0; font-size: 26px; }

.description {
    margin: 12px 0 25px;
    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d5d5d5;
    border-radius: 10px;
    font-size: 15px;
    text-align: center;
    outline: none;
}

input:focus { border-color: #111; }

button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { opacity: .9; }

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #999;
    line-height: 1.5;
}

@media(max-width:480px) {
    body { padding: 15px; }
    .card { padding: 28px 20px; }
    .brand { font-size: 25px; }
    h1 { font-size: 23px; }
}
</style>
</head>

<body>
<div class="page">

    <div class="brand">RD CYBERFORGE</div>
    <div class="tagline">Cybersecurity Training & Learning</div>

    <div class="card">
        <h1>Certificate Verification</h1>

        <p class="description">
            Verify the authenticity of an RD CyberForge
            certificate using the participant's Certificate ID.
        </p>

        <input
            type="text"
            id="certificateID"
            placeholder="Enter Certificate ID"
            autocomplete="off"
        >

        <button onclick="verifyCertificate()">
            VERIFY CERTIFICATE
        </button>
    </div>

    <div class="footer">
        © 2026 RD CyberForge<br>
        Official Certificate Verification Portal
    </div>

</div>

<script>

// Automatically process QR verification links
const params = new URLSearchParams(window.location.search);
const qrID = params.get("id");

if (qrID) {
    document.getElementById("certificateID").value = qrID;
    redirectToVerification(qrID);
}

function redirectToVerification(id) {
    window.location.replace(
        "verify.html?id=" + encodeURIComponent(id)
    );
}

function verifyCertificate() {
    const id = document.getElementById("certificateID").value.trim();

    if (!id) {
        alert("Please enter Certificate ID.");
        return;
    }

    redirectToVerification(id);
}

document.getElementById("certificateID")
.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        verifyCertificate();
    }
});

</script>
</body>
</html>
